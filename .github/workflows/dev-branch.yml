on:
  pull_request:
    branches:
      - dev

jobs:
  server-format-check:
    runs-on:  ubuntu-latest 
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: npm run format:write  