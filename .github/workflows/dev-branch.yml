on:
  pull_request:
    branches:
      - dev

jobs:
  server-format-check:
    runs-on: 
       group: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: npm run format:write  