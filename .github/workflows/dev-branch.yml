on:
  pull_request:
    branches:
      - dev
    paths:
      - "server/**"

jobs:
  server-format-check:
    name: Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          # cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run format:write
